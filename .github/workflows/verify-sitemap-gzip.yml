name: Verify sitemap gzip handling

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact contribution commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      AGNO_TELEMETRY: 'false'
      EXPECTED_SHA: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify exact contribution commit
        run: |
          python - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == os.environ['EXPECTED_SHA'], (actual, os.environ['EXPECTED_SHA'])
          print(actual)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development and reader dependencies
        run: python -m pip install -e 'libs/agno[dev]' -e 'libs/agnoctl[dev]' beautifulsoup4 pypdf aiofiles
      - name: Check formatting of changed files
        run: ruff format --check libs/agno/agno/knowledge/reader/sitemap_reader.py libs/agno/tests/unit/reader/test_sitemap_reader.py
      - name: Test sitemap discovery and page fetching
        run: python -m pytest libs/agno/tests/unit/reader/test_sitemap_reader.py libs/agno/tests/unit/reader/test_page_fetcher.py -q
      - name: Repository validation
        run: bash scripts/validate.sh
