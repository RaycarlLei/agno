name: Contribution verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact contribution commit SHA to validate
        required: true
        type: string
        default: ac1d30869c35b34619f03de37cc5dd67c5321203

permissions:
  contents: read

jobs:
  text-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      AGNO_TELEMETRY: "false"
      EXPECTED_SHA: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Verify contribution commit
        run: |
          python - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print("Checked out:", actual)
          assert actual == os.environ["EXPECTED_SHA"]
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e 'libs/agno[dev]' -e 'libs/agnoctl[dev]' aiofiles
      - name: Check contribution formatting
        run: ruff format --check libs/agno/agno/knowledge/reader/text_reader.py libs/agno/tests/unit/reader/test_text_reader.py
      - name: Run reader regression tests
        run: python -m pytest libs/agno/tests/unit/reader/test_text_reader.py libs/agno/tests/unit/reader/test_markdown_reader.py -q
      - name: Run repository validation
        run: bash scripts/validate.sh
